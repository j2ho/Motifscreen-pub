[project]
name = "motifscreen-aff"
version = "0.1.0"
description = "MotifScreen-Aff: SE(3)-equivariant virtual screening model"
requires-python = ">=3.9,<3.10"
dependencies = [
    "torch==1.13.1",
    "e3nn==0.5.1",
    "dgl==1.1.3",
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "tqdm",
    "pyyaml",
    "wandb>=0.15",
]

[project.optional-dependencies]
preprocessing = ["rdkit", "openbabel-wheel"]
# Optional: PyRosetta enables the training-time protein prep (score_jd2
# with H-optimization + HIS tautomer assignment). Ships a ~1 GB wheel
# from the RosettaCommons mirror. Only needed if you want to run
# scripts/prepare_with_pyrosetta.py; the default reduce-based path is
# always available without this.
rosetta = ["pyrosetta"]

[tool.uv]
package = false
find-links = [
    "https://data.dgl.ai/wheels/cu117/repo.html",
    "https://west.rosettacommons.org/pyrosetta/quarterly/release",
]

[[tool.uv.index]]
name = "pytorch-cu117"
url = "https://download.pytorch.org/whl/cu117"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu117" }
